<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BRADAR — медиапланер Telegram-каналов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2244; --ink:#26364F; --blue:#1668E3; --blue-d:#0F4FB0;
  --teal:#0B7E88; --teal2:#0E9AA7; --mint:#5FE3D0; --ice:#7FE3F0;
  --gold:#A97416; --gold-ink:#8A5E12; --gold-bg:#FFF8EC; --gold-bd:#F3E3C6;
  --red:#B3403A;
  --app:#EEF4FE; --card:#fff; --bd:#D7E3F5; --chip:#EDF3FD; --chip2:#E7EFFC;
  --soft:#F0F7FF; --soft2:#F5F9FF; --line:#E6EEFA;
  --gradA:linear-gradient(155deg,#0B2E6B 0%,#1668E3 58%,#1E9BB8 100%);
  --gradB:linear-gradient(150deg,#08203F 0%,#123E86 60%,#1668E3 100%);
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Manrope,system-ui,-apple-system,sans-serif;
  background:#DCE6F5;color:var(--navy);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
img{max-width:100%}
.tnum{font-variant-numeric:tabular-nums}

/* ---- app frame ---- */
#app{
  position:relative;max-width:440px;margin:0 auto;min-height:100vh;
  background:var(--app);overflow:hidden;
  box-shadow:0 0 60px rgba(8,32,63,.14);
}
.screen{display:none;flex-direction:column;min-height:100vh;animation:fade .28s ease}
.screen.active{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}  /* opacity-only: no transform, so the fixed tabbar stays viewport-anchored */

/* status bar (only shown outside Telegram) */
.sbar{display:flex;align-items:center;justify-content:space-between;
  padding:calc(8px + var(--sat)) 18px 4px;font:600 12px Manrope;color:#fff;
  position:relative;z-index:3}
.sbar .dots{opacity:.6}
body.tg .sbar{display:none}

/* ---- hero (gradient header) ---- */
.hero{position:relative;overflow:hidden;color:#fff;padding:0 18px}
.hero.a{background:var(--gradA)} .hero.b{background:var(--gradB)}
.hero::before{content:"";position:absolute;right:-70px;top:-60px;width:220px;height:220px;
  border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.2),rgba(255,255,255,0) 70%)}
.hero::after{content:"";position:absolute;left:-50px;bottom:-90px;width:190px;height:190px;
  border-radius:50%;border:1px solid rgba(255,255,255,.15)}
.hero>*{position:relative;z-index:1}
.hero h1{font:800 25px/1.18 Manrope;letter-spacing:-.5px;text-wrap:pretty;margin-bottom:10px}
.hero h2{font:800 21px/1.22 Manrope;letter-spacing:-.3px}
.hero p{font:500 13.5px/1.55 Manrope;color:rgba(255,255,255,.76);text-wrap:pretty}

.body{flex:1;padding:0 18px calc(26px + var(--sab))}
.pull{margin-top:-38px;position:relative;z-index:2}

/* nav row inside hero */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;margin-bottom:16px}
.back{font:700 13px Manrope;color:rgba(255,255,255,.8);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.brandmark{display:flex;align-items:center;gap:9px}
.blogo{width:28px;height:28px;border-radius:9px;background:#fff;overflow:hidden;
  border:1px solid rgba(255,255,255,.5);box-shadow:0 1px 4px rgba(8,20,45,.14);display:flex;align-items:center;justify-content:center}
.bname{font:700 14.5px Manrope;line-height:1.05;display:block}
.bsub{font:600 9.5px Manrope;color:rgba(255,255,255,.55);letter-spacing:.4px}
.hbtns{display:flex;gap:6px;flex-shrink:0}
.hbtn{padding:6px 9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  border-radius:9px;font:700 11px Manrope;color:#fff;white-space:nowrap}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px}
.card.lg{border-radius:18px;padding:17px}
.card.sh{box-shadow:0 2px 10px rgba(16,38,74,.05)}
.card+.card{margin-top:14px}
.hint{font:500 11.5px/1.5 Manrope;color:rgba(16,38,74,.42);text-wrap:pretty}
.aibadge{width:18px;height:18px;border-radius:6px;background:#EAF2FE;display:inline-flex;
  align-items:center;justify-content:center;font:800 10px Manrope;color:var(--blue);flex:none}
.rowhead{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.rowhead .t{font:700 12.5px Manrope;color:var(--navy)}

/* buttons */
.cta{display:block;width:100%;background:var(--blue);border-radius:14px;padding:15px;text-align:center;
  font:700 15px Manrope;color:#fff;box-shadow:0 6px 18px rgba(22,104,227,.28);transition:.15s}
.cta:active{transform:scale(.98)}
.cta.off{background:#B4C6DF;box-shadow:none;pointer-events:none}
.cta.dark{background:var(--navy);box-shadow:none}
.ghost{display:block;width:100%;text-align:center;font:600 13px Manrope;color:rgba(16,38,74,.5);padding:10px;margin-top:8px}
.subcta{margin:9px 0 0;font:500 11.5px/1.4 Manrope;color:rgba(16,38,74,.42);text-align:center;text-wrap:pretty}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;
  font:600 12.5px Manrope;color:var(--navy);transition:.15s}
.chip.on{background:#EAF2FE;border-color:#C7DEFB;color:var(--blue)}
.chip:active{transform:scale(.96)}
.pill{padding:9px 13px;background:var(--chip);border-radius:11px;font:600 12.5px Manrope;color:rgba(16,38,74,.65);transition:.15s}
.pill.on{background:var(--blue);color:#fff;font-weight:700}
.pill:active{transform:scale(.96)}
.excl{padding:9px 13px;border-radius:11px;font:600 12.5px Manrope;transition:.15s;
  background:var(--chip);color:rgba(16,38,74,.6)}
.excl.on{background:#FFF4F3;border:1px solid #F6CFCB;color:var(--red);font-weight:700}

/* textarea */
.ta{width:100%;border:none;outline:none;resize:none;background:transparent;
  font:400 13.5px/1.6 Manrope;color:var(--navy);min-height:74px}
.ta::placeholder{color:rgba(16,38,74,.35)}
.tafoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px;margin-top:6px}
.tools{display:flex;gap:7px}
.tool{padding:6px 10px;background:var(--chip);border-radius:9px;font:600 11.5px Manrope;color:rgba(16,38,74,.6)}
.count{font:400 11px Manrope;color:rgba(16,38,74,.3)}

/* progress dots (brief) */
.steps{display:flex;gap:5px}
.steps span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.steps span.on{background:#fff}

/* radios */
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#F3F8FF;border:1px solid #DCE7F7;border-radius:11px;transition:.15s}
.opt.on{background:var(--soft);border:1.5px solid var(--blue)}
.dot{width:16px;height:16px;border-radius:50%;border:1.6px solid #A9BEDC;flex:none}
.opt.on .dot{border:5px solid var(--blue);background:#fff}
.opt .lbl{font:600 13px Manrope;color:rgba(16,38,74,.65)}
.opt.on .lbl{font-weight:700;color:var(--navy)}

/* metric grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#DFE9F8;border-radius:12px;overflow:hidden}
.mgrid .cell{background:var(--soft2);padding:11px 12px}
.mgrid .cell .v{font:800 14.5px Manrope;color:var(--navy)}
.mgrid .cell .k{font:600 10px Manrope;color:rgba(16,38,74,.45);margin-top:2px}
.mgrid .cell .s{font:400 9.5px/1.3 Manrope;color:rgba(16,38,74,.35);margin-top:2px}

/* avatars */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;color:#fff}
.veri{border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center}

/* bottom nav — docked: always visible, content scrolls underneath */
.tabbar{display:flex;border-top:1px solid var(--bd);background:#fff;padding:9px 8px calc(14px + var(--sab));
  position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:440px;box-sizing:border-box;
  bottom:0;z-index:40}
.tabspace{flex:0 0 auto;height:calc(60px + var(--sab))}  /* reserves scroll room under the fixed bar */
.tab{flex:1;text-align:center}
.tab .ic{height:20px;display:flex;align-items:center;justify-content:center}
.tab .ic i{width:16px;height:16px;display:inline-block;border-radius:5px;border:1.6px solid #9DB4D6}
.tab .ic i.rnd{border-radius:50%}
.tab.on .ic i{background:var(--blue);border-color:var(--blue)}
.tab .tl{font:600 10px Manrope;color:rgba(16,38,74,.4);margin-top:4px}
.tab.on .tl{color:var(--blue);font-weight:700}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:none}
.sheet-wrap.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,20,45,.5);opacity:0;transition:.25s}
.sheet-wrap.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;background:#fff;
  border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(16,38,74,.24);
  padding:8px 18px calc(24px + var(--sab));max-height:92vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.sheet-wrap.open .sheet{transform:none}
.grip{width:36px;height:4px;border-radius:3px;background:#C6D6EC;margin:0 auto 16px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(26px + var(--sab));transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;font:700 12.5px Manrope;padding:11px 16px;border-radius:12px;
  box-shadow:0 8px 24px rgba(8,20,45,.35);opacity:0;pointer-events:none;transition:.28s;z-index:120;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* misc */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.section-head .t{font:800 15px Manrope;color:var(--navy)}
.section-head .a{font:700 12px Manrope;color:var(--blue)}
.bar{height:6px;border-radius:4px;background:#DFE9F8;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--teal2)}
.stack{display:flex;gap:2px;height:10px;border-radius:6px;overflow:hidden}

/* ---------------- desktop app shell (≥1024px) ---------------- */
.desktop-only{display:none}
#sidebar{display:none}
.sb-head{display:flex;align-items:center;gap:9px;font:800 17px Manrope;color:var(--navy);padding:4px 10px 22px}
.sb-head .blogo{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.sb-nav{display:flex;flex-direction:column;gap:4px}
.sb-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;cursor:pointer;font:700 13.5px Manrope;color:rgba(16,38,74,.6);transition:background .15s,color .15s}
.sb-item:hover{background:var(--soft)}
.sb-item.on{background:var(--soft);color:var(--blue)}
.sb-item .sb-ic{width:15px;height:15px;border-radius:5px;border:1.7px solid currentColor;opacity:.85}
.sb-item.rnd .sb-ic{border-radius:50%}
.sb-foot{margin-top:auto;padding:14px 10px 2px;font:500 11px/1.5 Manrope;color:rgba(16,38,74,.4)}
@media(min-width:1024px){
  .desktop-only{display:block}
  body{padding-left:236px;background:#E9EFF8}
  .sbar{display:none}
  /* content panel: wider, hugs its content (no forced full-height empty box) */
  #app{max-width:880px;border-radius:22px;margin:20px auto;min-height:0}
  .screen{min-height:0}
  .screen .hero{margin-top:0!important}
  .tabbar,.tabspace{display:none!important}
  #sidebar{display:flex;flex-direction:column;position:fixed;left:0;top:0;width:236px;height:100vh;box-sizing:border-box;padding:22px 16px;background:#fff;border-right:1px solid var(--bd);z-index:50}
  /* plan screen keeps its wide desktop mirror */
  body.plan-desk #app{max-width:1180px;border-radius:0;margin:0 auto;background:transparent;box-shadow:none}
  body.plan-desk #screen-plan{display:none!important}
  body.plan-desk #screen-plan-d{display:flex!important}
}
#screen-plan-d{display:none}
</style>
</head>
<body>
<aside id="sidebar" class="desktop-only"></aside>
<div id="app"></div>
<div class="sheet-wrap" id="sheetWrap"><div class="scrim" data-close-sheet></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================= *
 *  BRADAR — Telegram Media Planner (clickable prototype)
 *  Реализация дизайна «Telegram Media Planner v2»
 * ============================================================= */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(tg){
  try{
    tg.ready(); tg.expand();
    document.body.classList.add('tg');
    tg.setHeaderColor && tg.setHeaderColor('#0B2E6B');
    tg.setBackgroundColor && tg.setBackgroundColor('#EEF4FE');
  }catch(e){}
}
function haptic(kind){
  try{
    if(!tg||!tg.HapticFeedback) return;
    if(kind==='sel') tg.HapticFeedback.selectionChanged();
    else if(kind==='ok') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.impactOccurred(kind||'light');
  }catch(e){}
}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const app=$('app');
const fmt=n=>Math.round(n).toLocaleString('ru-RU').replace(/,/g,' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// direct t.me link only when we know the @username (else the user searches by name in Telegram)
function chUname(c){ return c && c.handle ? c.handle.replace('@','') : ''; }
function chUrl(c){ const u=chUname(c); return u.length>=3 ? 'https://t.me/'+u : ''; }
function chUrlLabel(c){ const u=chUname(c); return u.length>=3 ? 't.me/'+u : 'найти в Telegram →'; }
function openUrl(u){ if(!u) return false; try{ if(tg&&/t\.me\//.test(u)&&tg.openTelegramLink){tg.openTelegramLink(u);return true;} }catch(e){} try{ if(tg&&tg.openLink){tg.openLink(u);return true;} }catch(e){} try{ window.open(u,'_blank'); return true; }catch(e){} return false; }
function openChannelLink(c){ const u=chUrl(c); if(u){ openUrl(u); return; } if(c){ try{ copy(c.name,'Название канала скопировано — найдите его в поиске Telegram'); return; }catch(e){} } toast('Ссылка недоступна'); }

// derive brand name from the text (quoted or Latin/Capitalised token), else vertical default
function guessBrandName(text,def){
  const q=(text||'').match(/[«"]([^»"]{2,32})[»"]/); if(q) return q[1].trim();
  const lat=(text||'').match(/\b([A-ZА-ЯЁ][A-Za-zА-Яа-яё0-9é&]{2,20})\b/);
  if(lat && !/^(Мы|Наш|Наша|Хотим|Продаём|Бренд|Компания)$/i.test(lat[1])) return lat[1];
  return def;
}
function sameProject(pr){
  const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  return pr && norm(pr.desc) && norm(pr.desc)===norm(S.brand.desc);
}
function setupBrandFromInput(){
  const v=detectVertical(S.brand.desc); S.vertical=v;
  const m=V_META[v];

  const pr=S.profile||{};
  // Only reuse the saved profile when it's the SAME project (same description). A new/
  // different brand must NOT inherit the old project's site/channel/audience, or the
  // подбор would be biased toward the previous project.
  const same=sameProject(pr);
  // only real, user-provided values (from the saved profile of THIS project) — never a
  // vertical placeholder. Empty → the confirm screen shows no "connected source" row.
  S.brand.site=(same&&pr.site)||'';
  S.brand.channel=(same&&pr.channel)||'';
  S.tags=m.tags.slice();
  if(same&&pr.audience) S.brief.audience=pr.audience;                 // same project → keep saved audience
  else if(m.aud && !S.brief._audEdited) S.brief.audience=m.aud;       // new project → fresh vertical default (unless user typed one)
}

function overlapOf(chs){
  if(!chs.length) return 0;
  const byTopic={}; chs.forEach(c=>byTopic[c.topic]=(byTopic[c.topic]||0)+1);
  const maxDup=Math.max(...Object.values(byTopic));
  return Math.max(4,Math.min(22,Math.round((maxDup-1)/chs.length*40)+4));
}
function confidenceOf(chs){
  if(!chs.length) return 'Средняя';
  const avg=chs.reduce((s,c)=>s+c.match,0)/chs.length;
  return avg>=85?'Высокая':avg>=72?'Средняя':'Ниже средней';
}

  S.pool=POOL[v]||POOL.generic;
  S.plan.overlap=overlapOf(chans);
  S.plan.confidence=confidenceOf(chans);
  S.plan._views=null; S.plan._cpm=null;
  S.plan.clicks=clicksRange(chans.reduce((s,c)=>s+c.price/c.cpm*1000,0));
  S.currentPlanId=null; S.showAll=false; S.sort='match';
}
/* ---- alternatives for replacing any channel (from the vertical pool) ---- */
function altsFor(chId){
  const cur=S.channels.find(x=>x.id===chId); if(!cur) return [];
  const inPlan=new Set(S.channels.map(c=>c.id));
  return (S.pool||POOL.beauty).filter(c=>!inPlan.has(c.id))
    .slice().sort((a,b)=>b.match-a.match).slice(0,3)
    .map(c=>({ch:c,
      badge:c.match>cur.match?'ВЫШЕ СООТВЕТСТВИЕ':c.cpm<cur.cpm?'ДЕШЕВЛЕ':c.reach>cur.reach?'БОЛЬШЕ ОХВАТ':'АЛЬТЕРНАТИВА',
      badgeC:c.match>cur.match?'#0E9AA7':'#8DA0C4',
      d:[
        [c.match+'%','соответствие',(c.match-cur.match>0?'+':'')+(c.match-cur.match),c.match>=cur.match?'ok':'warn'],
        [fmt(c.cpm)+' ₽','CPM',(c.cpm-cur.cpm>0?'+':'')+fmt(c.cpm-cur.cpm),c.cpm<=cur.cpm?'ok':'warn'],
        [fmt(c.reach),'охват',(c.reach-cur.reach>0?'+':'')+fmt(c.reach-cur.reach),c.reach>=cur.reach?'ok':'warn'],
      ],
      note:c.why[0]||''}));
}

/* ---------- computed plan aggregates ---------- */
function planTotals(){
  const chs=S.channels;
  const budget=chs.reduce((s,c)=>s+c.price,0);
  let views=chs.reduce((s,c)=>s+ c.price/c.cpm*1000,0);
  const avgCpm=budget/views*1000;
  return {budget,views,avgCpm,count:chs.length};
}
function groupTotals(){
  const g={core:0,adj:0,exp:0};
  S.channels.forEach(c=>g[c.group]+=c.price);
  const budget=g.core+g.adj+g.exp||1;
  return {
    core:{sum:g.core,pct:Math.round(g.core/budget*100)},
    adj:{sum:g.adj,pct:Math.round(g.adj/budget*100)},
    exp:{sum:g.exp,pct:Math.round(g.exp/budget*100)},
  };
}

}

// funnel conversion (click → result) by campaign goal — stated assumptions, ranges
const GOAL_CR={ 'Продажи':[0.01,0.03,'покупок'], 'Заявки':[0.05,0.12,'заявок'], 'Установки':[0.25,0.45,'установок'], 'Подписчики':[0.08,0.20,'подписчиков'] };
// professional media-plan forecast: net (unique) reach, frequency, CPC, funnel result
function kpiForecast(t){
  const gross=t.views||0;
  const overlap=S.plan.overlap||10;
  const dedup=Math.max(0.62,Math.min(0.88, 0.86-(overlap/100)*0.8));  // unique-reach discount from audience overlap
  const net=Math.round(gross*dedup);
  const freq=gross/(net||1);
  const clkLo=Math.round(gross*0.0078), clkHi=Math.round(gross*0.0104);  // CTR band
  const cpcLo=t.budget/(clkHi||1), cpcHi=t.budget/(clkLo||1);
  const cr=GOAL_CR[S.brief.goal||''];
  const result=cr?{lo:Math.round(clkLo*cr[0]),hi:Math.round(clkHi*cr[1]),label:cr[2],crLo:Math.round(cr[0]*100),crHi:Math.round(cr[1]*100)}:null;
  return {gross,net,freq,clkLo,clkHi,cpcLo,cpcHi,result};
}
function kpiCard(t){

  const freqStr=String(Math.round(f.freq*10)/10).replace('.',',');

  return `<div class="card lg" style="margin-top:16px">

      <div class="cell"><div class="v tnum" style="font-size:17px">${fmt(f.clkLo)}–${fmt(f.clkHi)}</div><div class="k">переходов</div><div class="s">CTR 0,8–1,0%</div></div>
      <div class="cell"><div class="v tnum" style="font-size:17px">${cpc}</div><div class="k">цена перехода</div><div class="s">CPC · бюджет ÷ переходы</div></div>
    </div>
    ${f.result?`<div style="margin-top:12px;padding:12px 14px;background:var(--soft);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px">

      <div class="tnum" style="font:800 20px Manrope;color:var(--blue);white-space:nowrap">${fmt(f.result.lo)}–${fmt(f.result.hi)}</div>

// real-data channel detail (Telemetr) — only real numbers, no fabricated blocks
// Agency-style audience vetting: a 0–100 quality score + plain-language signals,
// computed ONLY from real Telemetr metrics (reach/subs, ER, growth, premium, ads
// index). This is the due-diligence a media-buyer does to filter out inflated /
// dead / bot-padded channels before recommending a placement.
function auditQuality(c){
  const m=c.metrics||{}; const subs=c.subs||0; const reach=m.reach||c.reach||0;
  const sig=[]; let score=70;
  const er=v=>String(Math.round(v*10)/10).replace('.',',');
  if(subs>0 && reach>0){
    const r=reach/subs, rp=Math.round(r*100);
    if(r<0.08){ score-=26; sig.push([0,`Низкий охват — посты видят лишь ${rp}% подписчиков. Возможна накрутка или «мёртвая» аудитория.`]); }
    else if(r<0.15){ score-=6; sig.push([0,`Охват ниже нормы — ${rp}% подписчиков, часть аудитории пассивна.`]); }
    else if(r<=0.6){ score+=15; sig.push([1,`Живая аудитория — охват ${rp}% от подписчиков (в норме).`]); }
    else { score+=4; sig.push([1,`Высокий охват — ${rp}% подписчиков видят посты.`]); }
  }
  if(m.err>0){
    if(m.err>=4){ score+=8; sig.push([1,`Высокая вовлечённость — ER ${er(m.err)}%.`]); }
    else if(m.err<1.5){ score-=10; sig.push([0,`Низкая вовлечённость — ER ${er(m.err)}%, аудитория слабо реагирует.`]); }
  }
  if(subs>0 && typeof m.growth30==='number' && m.growth30!==0){
    const g=m.growth30/subs, gp=Math.round(Math.abs(g)*100);
    if(g>0.25){ score-=16; sig.push([0,`Резкий прирост +${gp}% за месяц — проверьте на накрутку подписчиков.`]); }
    else if(g<-0.03){ score-=8; sig.push([0,`Аудитория убывает — −${gp}% за месяц.`]); }
    else if(g>0){ score+=6; sig.push([1,`Органический прирост +${gp}% за месяц.`]); }
  }
  if(m.premium>=3){ score+=5; sig.push([1,`Платёжеспособная аудитория — ${m.premium}% Premium.`]); }
  const gk=(m.adsGrade||'').charAt(0).toUpperCase();
  if(gk==='A'||gk==='B'){ score+=6; sig.push([1,`Хорошая рекламная репутация (индекс Telemetr ${m.adsGrade}).`]); }
  else if(gk==='D'||gk==='E'||gk==='F'){ score-=6; sig.push([0,`Слабый рекламный индекс Telemetr (${m.adsGrade}).`]); }
  if(!sig.length) sig.push([1,'Метрики в пределах нормы для тематики.']);
  score=Math.max(20,Math.min(98,Math.round(score)));
  return {score, label: score>=80?'Высокое':score>=65?'Хорошее':score>=50?'Среднее':'Низкое — осторожно',
    color: score>=65?'var(--teal)':score>=50?'var(--gold)':'#D9534F', sig};
}
function auditCard(c){
  const q=auditQuality(c);
  return `<div class="card lg">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px">
      <div style="font:700 13px Manrope;color:var(--navy)">Проверка аудитории</div>
      <div style="display:flex;align-items:baseline;gap:6px"><span class="tnum" style="font:800 20px Manrope;color:${q.color}">${q.score}</span><span style="font:600 11px Manrope;color:${q.color}">/ 100 · ${q.label}</span></div>

}

function cmpBadge(before,after,lowerBetter,pct){
  if(after===before) return ['','none'];
  const better=lowerBetter?after<before:after>before;
  if(pct){ const p=Math.round((after/before-1)*1000)/10; return [(p>0?'+':'')+p+'%',better?'ok':'warn']; }
  return [better?'лучше':'выше',better?'ok':'warn'];
}
function recalcSummary(r){
  const cheaper=r.after.cpm<r.before.cpm, lessOverlap=r.after.overlap<r.before.overlap, moreViews=r.after.views>r.before.views;
  if(cheaper&&lessOverlap&&!moreViews) return 'Охват стал меньше, зато контакт дешевле и аудитории почти не пересекаются — для запуска это часто выгоднее.';
  if(moreViews&&cheaper) return 'Больше охват при более дешёвом контакте — план стал эффективнее по стоимости просмотров.';
  if(moreViews&&!cheaper) return 'Охват вырос, но средний контакт стал дороже — стоит следить за стоимостью результата.';
  return 'Показатели плана пересчитаны с учётом новой площадки.';
}
function diffRow(k,before,after,badge,kind){
  const bg=kind==='ok'?'#E9F6F6':kind==='warn'?'#FFF3E0':'transparent';
  const col=kind==='ok'?'var(--teal)':kind==='warn'?'var(--gold)':'transparent';
  return `<div style="display:flex;align-items:center;gap:10px">
    <span style="font:600 12px Manrope;color:var(--ink);flex:1">${k}</span>
    <span class="tnum" style="font:600 12px Manrope;color:rgba(16,38,74,.35);text-decoration:line-through">${before}</span>
    <span class="tnum" style="font:800 13px Manrope;color:var(--navy)">${after}</span>
    ${badge?`<span style="padding:2px 6px;background:${bg};border-radius:5px;font:800 10px Manrope;color:${col}">${badge}</span>`:''}</div>`;
}
function grpDelta(k,pct,delta){

  return `<div style="display:flex;align-items:center;gap:8px">

}

/* ---- perform replacement + full recalc (computed from data) ---- */
function doReplace(chId){
  const a=SHEET_ALTS[SHEET_SEL]; if(!a) return;
  const alt=a.ch;
  const idx=S.channels.findIndex(x=>x.id===chId); if(idx<0) return;
  const bt=planTotals();
  const before={views:Math.round(bt.views),cpm:Math.round(bt.avgCpm),overlap:S.plan.overlap,clicks:S.plan.clicks};
  const beforeGroups=groupTotals();
  const price=S.channels[idx].price;
  const newCh=Object.assign({},alt,{price,group:alt.group||TOPIC_GROUP[alt.topic]||'adj',pinned:true,_new:true,
    placement:{price,clicks:'≈'+fmt(Math.round(price/alt.cpm*1000*0.0092))+' переходов по прогнозу'}});
  S._prevChannel=S.channels[idx];
  S.channels.splice(idx,1,newCh);
  S.plan.overlap=overlapOf(S.channels);
  S.plan.confidence=confidenceOf(S.channels);
  const at=planTotals();
  S.plan.clicks=clicksRange(at.views);
  const afterGroups=groupTotals();
  S.lastRecalc={ alt:newCh, before,
    after:{views:Math.round(at.views),cpm:Math.round(at.avgCpm),overlap:S.plan.overlap,clicks:S.plan.clicks},
    groupDelta:{core:afterGroups.core.pct-beforeGroups.core.pct,adj:afterGroups.adj.pct-beforeGroups.adj.pct,exp:afterGroups.exp.pct-beforeGroups.exp.pct} };
  S.currentPlanId=null; // plan changed → mark unsaved
  closeSheet(); haptic('ok'); go('recalc');
}
function undoReplace(){
  if(!S._prevChannel||!S.lastRecalc) return;
  const idx=S.channels.findIndex(x=>x.id===S.lastRecalc.alt.id);
  if(idx>=0) S.channels.splice(idx,1,S._prevChannel);
  S.plan.overlap=S.lastRecalc.before.overlap;
  S.plan.clicks=S.lastRecalc.before.clicks;
  S.plan.confidence=confidenceOf(S.channels);
  S.lastRecalc=null; S._prevChannel=null;
  toast('Замена отменена');
  go('plan');
}

    const why=(c.why||[]).slice(0,3).map(w=>`<li>${esc(w)}</li>`).join('');
    const risks=(c.risks||[]).length?`<div class=risk>⚠ ${(c.risks||[]).map(esc).join(' · ')}</div>`:'';
    return `<div class=ch><div class=chh><b>${esc(c.name)}</b><span class=chm>${c.match}% соответствие · ${fmt(c.price)} ₽</span></div>${why?`<ul>${why}</ul>`:''}${risks}<div class=fmtline><b>Формат:</b> ${esc(b.f)} · <b>Посыл:</b> ${esc(b.a)}</div></div>`;}).join('');
  const byG={core:[],adj:[],exp:[]}; chs.forEach(c=>{(byG[c.group]||byG.adj).push(c);});
  const weeks=[['Неделя 1 — старт с ядра',byG.core.slice(0,3),'Прайм-каналы ядра. Снимаем первые данные по CPC и конверсии.'],['Неделя 2 — расширение',byG.adj.slice(0,3),'Смежные интересы — масштабируем на сработавшем оффере.'],['Неделя 3 — тест и повтор',byG.exp.slice(0,3),'Эксперименты + повтор лучшего канала недели 1.']].filter(w=>w[1].length);
  const flights=weeks.map((w,i)=>`<div class=wk><div class=wkn>${i+1}</div><div><b>${w[0]}</b><div class=wkc>${w[1].map(c=>esc(c.name)).join(' · ')}</div><div class=m>${w[2]}</div></div></div>`).join('');
  const utm=`?utm_source=&lt;канал&gt;&amp;utm_medium=telegram&amp;utm_campaign=${slug(S.brand.name)}`;
  const resultKpi=f.result?`<div class=kpi><b>${fmt(f.result.lo)}–${fmt(f.result.hi)}</b><span>${esc(f.result.label)} · CR ${f.result.crLo}–${f.result.crHi}%</span></div>`:'';
  return `<!DOCTYPE html><html lang=ru><head><meta charset=utf-8><title>Медиаплан ${esc(S.brand.name)}</title>
  <style>*{box-sizing:border-box}body{font-family:Manrope,Arial,sans-serif;color:#0E2244;margin:0;padding:34px;max-width:940px}
  h1{font-size:25px;margin:0 0 4px}.sub{color:#5A6B90;margin:0 0 22px}
  h2{font-size:15px;margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid #E6EEFA;letter-spacing:.2px}
  .kpis{display:flex;gap:12px;margin:0 0 8px;flex-wrap:wrap}
  .kpi{flex:1;min-width:110px;background:#F0F7FF;border:1px solid #D7E7FC;border-radius:10px;padding:11px 13px}
  .kpi b{display:block;font-size:18px}.kpi span{color:#5A6B90;font-size:11px}
  .strat{background:#F7FAFF;border:1px solid #E6EEFA;border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.6}
  .split{display:flex;gap:10px;margin-top:12px}.split div{flex:1;font-size:11.5px}.split b{font-size:14px;display:block}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:left;background:#0E2244;color:#fff;padding:8px 9px;font-size:10.5px}
  td{padding:8px 9px;border-bottom:1px solid #E6EEFA;vertical-align:top}.m{color:#8DA0C4;font-size:10px}
  .ch{border:1px solid #E6EEFA;border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .chh{display:flex;justify-content:space-between;align-items:baseline}.chm{color:#5A6B90;font-size:11px}
  .ch ul{margin:8px 0 6px 16px;padding:0;font-size:11.5px;line-height:1.5}.ch li{margin-bottom:2px}
  .risk{color:#A6741C;background:#FFF8EC;border-radius:7px;padding:6px 9px;font-size:11px;margin:4px 0}
  .fmtline{font-size:11px;color:#3A4A66;margin-top:6px}
  .wk{display:flex;gap:11px;margin-bottom:11px}.wkn{flex:none;width:24px;height:24px;border-radius:7px;background:#EAF2FF;color:#1668E3;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}.wkc{font-size:12px;margin:3px 0}
  .utm{font-family:monospace;font-size:11px;background:#F7FAFF;border:1px solid #E6EEFA;border-radius:8px;padding:9px 11px;word-break:break-all}
  .note{margin-top:20px;color:#8DA0C4;font-size:10.5px;line-height:1.5;border-top:1px solid #E6EEFA;padding-top:12px}
  @media print{body{padding:0}h2,.ch,.wk{break-inside:avoid}}</style></head>
  <body><img src="${LOGO_FULL}" alt="BRADAR" style="height:30px;margin:0 0 16px;display:block"><h1>Медиаплан для ${esc(S.brand.name)}</h1><p class=sub>by Kapin Group · ${fmtDate(Date.now())} · ${t.count} каналов · бюджет ${fmt(t.budget)} ₽</p>

  <h2>Сводка и прогноз</h2>
  <div class=kpis>
    <div class=kpi><b>${fmt(t.budget)} ₽</b><span>бюджет</span></div>
    <div class=kpi><b>${fmt(f.net)}</b><span>чистый охват (уник.)</span></div>
    <div class=kpi><b>${freqStr}×</b><span>частота контакта</span></div>
    <div class=kpi><b>${fmt(f.clkLo)}–${fmt(f.clkHi)}</b><span>переходов</span></div>
    <div class=kpi><b>${cpc}</b><span>CPC</span></div>
    <div class=kpi><b>${fmt(t.avgCpm)} ₽</b><span>средний CPM</span></div>
    ${resultKpi}
  </div>

  <h2>Стратегия и распределение бюджета</h2>
  <div class=strat>${esc(strategyText())}
    <div class=split><div><b>${g.core.pct}%</b>Основное ядро · ${fmt(g.core.sum)} ₽</div><div><b>${g.adj.pct}%</b>Смежные · ${fmt(g.adj.sum)} ₽</div><div><b>${g.exp.pct}%</b>Эксперименты · ${fmt(g.exp.sum)} ₽</div></div>
  </div>

  <h2>Каналы</h2>
  <table><thead><tr><th>#</th><th>Канал</th><th>Подписч.</th><th>Охват</th><th>Соотв.</th><th>Качество</th><th>CPM</th><th>Цена</th></tr></thead><tbody>${rows}</tbody></table>

  <h2>Обоснование по каналам</h2>
  ${rationale}

  <h2>План размещения</h2>
  ${flights}

  <h2>Трекинг</h2>
  <div class=utm>${utm}</div>
  <p class=m style="margin-top:8px">Свой utm_source и отдельная ссылка/промокод на каждый канал — для точного замера CPC и стоимости заявки по каждому размещению.</p>

  <p class=note><b>Методология.</b> Каналы отобраны по соответствию бренду, реальным метрикам (охват, вовлечённость, динамика) и проверке аудитории на накрутку. Прогноз построен по средним показателям каналов и типовой воронке — он не гарантирует результат кампании. Оценка «Качество» (0–100) отражает живость и надёжность аудитории по данным Telemetr. Подготовлено в BRADAR.</p>
  </body></html>`;
}
function shareText(){
  const t=planTotals();
  return `Медиаплан для ${S.brand.name}: ${t.count} каналов, бюджет ${fmt(t.budget)} ₽, ≈${fmt(Math.round(t.views/1000)*1000)} просмотров, CPM ${fmt(t.avgCpm)} ₽.`;
}
function sharePlan(){
  const txt=shareText();
  if(tg&&tg.openTelegramLink){ try{tg.openTelegramLink('https://t.me/share/url?url=https://bradar.app&text='+encodeURIComponent(txt)); return;}catch(e){} }
  if(navigator.share){ try{ navigator.share({title:'Медиаплан '+S.brand.name,text:txt}); return; }catch(e){} }
  copy(txt,'Сводка медиаплана скопирована');
}
function copy(text,msg){
  try{ if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast(msg||'Скопировано'),()=>toast(msg||'Скопировано')); return; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }catch(e){}
  toast(msg||'Скопировано');
}
function downloadPlan(){
  haptic('ok');
  const f=S.exportFmt||'PDF';
  if(f==='XLSX'){ download('mediaplan_'+slug(S.brand.name)+'.csv','text/csv;charset=utf-8;',genCSV())?toast('Файл (CSV/XLSX) скачан'):toast('Скачивание недоступно в этом окне'); return; }
  if(f==='Ссылка'){ copy(shareText()+'\nhttps://bradar.app','Ссылка на медиаплан скопирована'); return; }
  // PDF via printable document
  const html=genPrintHTML();
  let w=null; try{ w=window.open('','_blank'); }catch(e){}
  if(w){ w.document.write(html); w.document.close(); setTimeout(()=>{try{w.focus();w.print();}catch(e){}},400); toast('Открыли версию для печати → сохраните как PDF'); }
  else if(download('mediaplan_'+slug(S.brand.name)+'.html','text/html;charset=utf-8',html)){ toast('Медиаплан скачан (откройте и «Печать → PDF»)'); }
  else toast('Экспорт недоступен в этом окне');
}

/* ---- analysis animation ---- */
let analysisTimer=null;
function runAnalysis(){
  if(analysisTimer) clearInterval(analysisTimer);
  let active=0, prog=8;
  const tl=$('aTimeline'); if(!tl) return;
  const paint=()=>{ tl.innerHTML=ASTEPS.map((st,i)=>aStepRow(st,i,active)).join(''); };
  paint();
  analysisTimer=setInterval(()=>{
    const p=tl.querySelector('.aprog');
    prog+=Math.random()*22+8;
    if(p) p.style.width=Math.min(100,prog)+'%';
    if(prog>=100){
      prog=8; active++;
      if(active>=ASTEPS.length){
        clearInterval(analysisTimer); analysisTimer=null;
        if(CURRENT==='analysis'){ haptic('ok'); go('plan'); }
        return;
      }
      paint();
    }
  },520);
}

/* ---- spinner keyframe injection ---- */
const st=document.createElement('style');
st.textContent='@keyframes spin{to{transform:rotate(360deg)}}.aspin{animation:spin .8s linear infinite}.pbtn{flex:1;padding:11px;background:var(--chip2);border-radius:11px;text-align:center;font:700 12.5px Manrope;color:rgba(16,38,74,.65);transition:.15s}.pbtn:active{transform:scale(.97)}.pbtn.dark{background:var(--navy);color:#fff}.pbtn.accent{background:var(--blue);color:#fff}';
document.head.appendChild(st);

/* ---- resize -> desktop plan switch ---- */
let rz; window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{ if(CURRENT==='plan'){ render(); const el=document.body.classList.contains('plan-desk')?null:$('screen-plan'); if(el)el.classList.add('active'); updateDesktop(); }},150);});

// desktop sidebar nav (reuses the same data-tab routing as the mobile tab bar)
function buildSidebar(){
  const sb=$('sidebar'); if(!sb) return;
  const items=[['find','Новый подбор',0],['plans','Медиапланы',0],['fav','Избранное',1],['profile','Профиль',1]];
  sb.innerHTML='<div class="sb-head"><div class="blogo">'+logoMark(26)+'</div><span>BRADAR</span></div>'+
    '<nav class="sb-nav">'+items.map(t=>`<div class="sb-item ${t[2]?'rnd':''}" data-tab="${t[0]}"><span class="sb-ic"></span>${t[1]}</div>`).join('')+'</nav>'+
    '<div class="sb-foot">Прогнозы не гарантируют результат кампании.</div>';
}
const SB_MAP={onboard:'find',confirm:'find',brief:'find',analysis:'find',plan:'find',channel:'find',recalc:'find',export:'find',saved:'plans',favorites:'fav',profile:'profile'};
function updateSidebar(){
  const active=SB_MAP[CURRENT]||'';
  document.querySelectorAll('#sidebar .sb-item').forEach(el=>el.classList.toggle('on', el.getAttribute('data-tab')===active));
}
function postRender(){
  // keep desktop mirror active flag consistent
  if(CURRENT==='plan'){ const d=$('screen-plan-d'); if(d) d.classList.add('active'); }
  updateSidebar();
}

/* ---- boot ---- */
try{ var fav=document.createElement('link'); fav.rel='icon'; fav.href=LOGO_ICON; document.head.appendChild(fav); }catch(e){}
// Start blank by default — a new подбор must NOT default to the last project. The saved
// profile stays available on the Профиль screen (tap «Сохранить профиль» to reuse it).
buildSidebar();
go('onboard',false);
</script>
<script src="/bradar-api.js"></script>
